[project]
name = "verilays"
version = "0.0.1"
description = "Catch agent actions that report success but didn't happen"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "click>=8.1",
    "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
# The worker sends each verdict to Langfuse as a score when LANGFUSE_SECRET_KEY is set.
langfuse = ["langfuse>=3"]

[project.scripts]
verilays = "verilays.cli:main"

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.45.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27+ reads `license = "Apache-2.0"`
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
